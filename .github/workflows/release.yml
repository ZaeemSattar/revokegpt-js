# Tags `v*`. The verify job (no OIDC token) installs from the shipped lockfile, builds, packs every public package
# and checks the tarballs with `npm publish --dry-run`. The publish job holds the OIDC token and installs nothing: it
# attests the packed tarballs and publishes exactly those files with `npm publish --provenance` through npm trusted
# publishing (no NODE_AUTH_TOKEN anywhere). A manual run with dry-run true (the default) stops after the dry run.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run everything except the final upload (a real release needs a tag on the default branch)
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dry-run: ${{ steps.gate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          TAG_RE: "^v[0-9]+[.][0-9]+[.][0-9]+$"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then dry=false; else dry="$INPUT_DRY_RUN"; fi
          case "$dry" in true|false) ;; *) echo "::error::bad dry-run value"; exit 1 ;; esac
          if [ "$dry" = "false" ]; then
            # A real release: an annotated tag of this repository whose commit is on the default branch.
            [ "$REF_TYPE" = "tag" ] || { echo "::error::a real release runs from a tag"; exit 1; }
            printf '%s' "$REF_NAME" | grep -Eq "$TAG_RE" || { echo "::error::the tag does not match $TAG_RE"; exit 1; }
            [ "$(git cat-file -t "refs/tags/$REF_NAME")" = "tag" ] || { echo "::error::the tag is not annotated"; exit 1; }
            sha="$(git rev-parse --verify "refs/tags/$REF_NAME^{commit}")"
            # The jobs after this one build and publish the commit of the event, not whatever the tag says later.
            [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::the tag no longer points at the commit this run was started for"; exit 1; }
            git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null || { echo "::error::no default branch"; exit 1; }
            git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH" || { echo "::error::the tagged commit is not on the default branch"; exit 1; }
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install (frozen lockfile, no lifecycle scripts) and build
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r build
      - name: Pack every public package and check the tarballs (this is the whole dry run)
        run: |
          mkdir "$RUNNER_TEMP/tarballs"
          pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"
          for f in "$RUNNER_TEMP"/tarballs/*.tgz; do npm publish --dry-run --access public "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.dry-run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tarballs/*.tgz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Publish the attested tarballs with provenance (npm trusted publishing)
        run: |
          for f in tarballs/*.tgz; do npm publish "$f" --provenance --access public; done
